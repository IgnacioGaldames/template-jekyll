<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title | escape }}",
    "url": "{{ site.url }}{{ site.baseurl }}"{% if site.description %},
    "description": "{{ site.description | escape }}"{% endif %}{% if site.name %},
    "author": {
        "@type": "Person",
        "name": "{{ site.name | escape }}"{% assign has_social = false %}{% if site.twitter_username and site.twitter_username != "" %}{% assign has_social = true %}{% endif %}{% if site.linkedin_username and site.linkedin_username != "" %}{% assign has_social = true %}{% endif %}{% if site.github_username and site.github_username != "" %}{% assign has_social = true %}{% endif %}{% if has_social %},
        "sameAs": [{% assign separator = "" %}{% if site.twitter_username and site.twitter_username != "" %}{{ separator }}"https://twitter.com/{{ site.twitter_username }}"{% assign separator = "," %}{% endif %}{% if site.instagram_username and site.instagram_username != "" %}{{ separator }}"https://www.instagram.com/{{ site.instagram_username }}"{% assign separator = "," %}{% endif %}{% if site.linkedin_username and site.linkedin_username != "" %}{{ separator }}"https://www.linkedin.com/in/{{ site.linkedin_username }}"{% assign separator = "," %}{% endif %}{% if site.facebook_username and site.facebook_username != "" %}{{ separator }}"https://www.facebook.com/{{ site.facebook_username }}"{% assign separator = "," %}{% endif %}{% if site.youtube_username and site.youtube_username != "" %}{{ separator }}"https://www.youtube.com/{{ site.youtube_username }}"{% assign separator = "," %}{% endif %}{% if site.github_username and site.github_username != "" %}{{ separator }}"https://github.com/{{ site.github_username }}"{% assign separator = "," %}{% endif %}{% if site.pinterest_username and site.pinterest_username != "" %}{{ separator }}"https://www.pinterest.com/{{ site.pinterest_username }}"{% assign separator = "," %}{% endif %}{% if site.behance_username and site.behance_username != "" %}{{ separator }}"https://www.behance.net/{{ site.behance_username }}"{% assign separator = "," %}{% endif %}{% if site.flickr_username and site.flickr_username != "" %}{{ separator }}"https://www.flickr.com/photos/{{ site.flickr_username }}"{% assign separator = "," %}{% endif %}{% if site.tumblr_username and site.tumblr_username != "" %}{{ separator }}"https://{{ site.tumblr_username }}.tumblr.com"{% endif %}
        ]{% endif %}
    }{% endif %}
}
</script>
